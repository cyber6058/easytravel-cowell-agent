[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "easytravel-briefing-materials"
version = "0.1.0"
description = "EasyTravel local travel briefing document and audio workflow"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27",
  "PyMuPDF>=1.26",
]

[project.scripts]
briefing = "travel_briefing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["travel_briefing*"]

[tool.setuptools.package-data]
travel_briefing = ["data/*.json"]
