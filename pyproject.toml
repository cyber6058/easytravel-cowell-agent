[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "easytravel-cowell-agent"
version = "0.3.2"
description = "EasyTravel passport roster and existing-order Cowell rooming agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27",
  "keyring>=25.0",
  "Pillow>=11.0",
  "playwright>=1.50",
  "PyMuPDF>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "respx>=0.22",
]

[project.scripts]
cowell = "cowell_cli.cli:main"
briefing = "travel_briefing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
travel_briefing = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
